<script>
  /* anti-FOUC theme boot */
  (function(){
    try{
      var t = localStorage.getItem('pilot.theme');
      if(!t){ t = matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'day'; }
      document.documentElement.setAttribute('data-theme', t);
    }catch(e){}
  })();
</script>

<body>
  <a class="skip-link" href="#view">Skip to content</a>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="Pilot home">
      <svg class="logo" viewBox="0 0 32 32" fill="none" aria-hidden="true">
        <rect x="3" y="3" width="26" height="26" rx="7" fill="var(--accent)"/>
        <circle cx="16" cy="13" r="4.4" fill="var(--accent-ink)"/>

      </svg>
      <span class="wordmark">pilot</span>
    </a>

    <nav class="mainnav desktop-only" aria-label="Primary">
      <a class="navlink" href="#/" data-route="home">Path</a>

      <span class="st-label">Search…</span>
      <kbd>Ctrl K</kbd>
    </button>

    <a class="progress-core" id="progress-core" href="#/me" aria-label="Your progress">
      <span class="ring" id="core-ring"></span>
      <span class="pc-label" id="core-label">0%</span>
    </a>

    <button class="iconbtn" id="theme-toggle" aria-label="Toggle theme" title="Toggle Daylight / Workbench">
      <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v3M12 20v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M1 12h3M20 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
    </button>
  </header>

  <main id="view" tabindex="-1"></main>

  <div id="overlay-host"></div>
